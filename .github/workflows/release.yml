# Manual release of every @aibyters/* package to a private registry.
#
# Licensed distribution: these packages are proprietary ("SEE LICENSE IN LICENSE") and are
# published with access=restricted. Point NPM_REGISTRY at the private registry that licensees
# are given credentials for (GitHub Packages, Verdaccio, Artifactory, Nexus, ...). The public
# npmjs.org URL is only the default so that a scoped organisation registry works out of the box.
#
# Required repository settings:
#   secrets.NPM_TOKEN     publish token for the registry (write access to the @aibyters scope)
#   vars.NPM_REGISTRY     registry URL, e.g. https://npm.pkg.github.com (optional, see default below)
#
# See docs/RELEASING.md for the end-to-end procedure.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.0). Must match the workspace version."
        required: true
        type: string
      dry_run:
        description: "Run every check but skip the actual publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify tag matches workspace version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ inputs.tag }}" != "v$VERSION" ]; then
            echo "::error::Tag '${{ inputs.tag }}' does not match package.json version 'v$VERSION'"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Release checks (metadata, dist, LICENSE)
        run: node scripts/release-check.mjs

      - name: Bundle size report
        run: node scripts/bundle-size.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Configure registry credentials
        run: |
          HOST="$(node -e "console.log(new URL(process.env.NPM_REGISTRY).host + new URL(process.env.NPM_REGISTRY).pathname.replace(/\/$/, ''))")"
          {
            echo "@aibyters:registry=${NPM_REGISTRY}"
            echo "//${HOST}/:_authToken=\${NPM_TOKEN}"
          } >> "$HOME/.npmrc"

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -r --filter './packages/**' publish --no-git-checks --access restricted --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -r --filter './packages/**' publish --no-git-checks --access restricted
