<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Byters charts — host smoke test (no Tailwind)</title>
    <!-- Deliberately hostile host: default browser styles, Arial, a 3-column grid with narrow cells. -->
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f4; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 16px; }
      h1 { font-size: 16px; padding: 12px 16px 0; margin: 0; }
    </style>
  </head>
  <body>
    <h1>Host smoke test: no Tailwind, no reset, narrow cells, light theme</h1>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
