[project]
name = "aibyters_charts"
version = "0.1.0"
authors = [{ name = "AI Byters", email = "aibytersdev@gmail.com" }]
description = "Executive-grade dashboards and 60+ responsive chart widgets for Frappe and ERPNext"
readme = "README.md"
license = { file = "license.txt" }
requires-python = ">=3.10"
# frappe / erpnext must NOT be listed here (the Marketplace audit flags it); see frappe-dependencies.
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Ranges, never hard pins: the Marketplace audit derives "Supported versions" from this.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
